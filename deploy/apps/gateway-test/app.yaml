apiVersion: v1
kind: Namespace
metadata:
  name: event-ticket
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-test
  namespace: event-ticket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-test
  template:
    metadata:
      labels:
        app: gateway-test
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-test
  namespace: event-ticket
spec:
  selector:
    app: gateway-test
  ports:
    - name: http
      port: 80
      targetPort: 80
