apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: event-ticket
  namespace: istio-ingress
spec:
  selector:
    istio: ingress
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - hanseo.asuscomm.com
      tls:
        mode: SIMPLE
        credentialName: event-ticket-tls
