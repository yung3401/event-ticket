grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 1Gi
  service:
    type: ClusterIP

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GiB
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 3Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

# k3s 전용 endpoint 설정은 이후 구성
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

prometheus-node-exporter:
  hostRootFsMount:
    enabled: true
    mountPropagation: None



grafana:
  enabled: true
  grafana.ini:
    server:
      domain: hanseo.asuscomm.com
      root_url: https://hanseo.asuscomm.com/grafana/
      serve_from_sub_path: true

# 기존 admin, persistence, service 설정 유지

